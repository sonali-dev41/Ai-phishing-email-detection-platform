<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{

font-family:Arial;

text-align:center;

background:#f2f2f2;

}

.card{

width:250px;

padding:20px;

margin:20px auto;

background:white;

border-radius:10px;

box-shadow:0 0 10px gray;

}

</style>

</head>

<body>

<h1>AI Phishing Dashboard</h1>

<div class="card">

<h2>Total Emails</h2>

<h1>{{ total }}</h1>

</div>

<div class="card">

<h2>Phishing Emails</h2>

<h1>{{ phishing }}</h1>

</div>

<div class="card">

<h2>Safe Emails</h2>

<h1>{{ safe }}</h1>

<div class="card">
    <h2>Average Confidence</h2>
    <h1>{{ avg_confidence }}%</h1>
</div>

</div>
<canvas id = "pieChart" width ="200" height="200"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const ctx = document.getElementById('pieChart');

new Chart(ctx, {
    type: 'pie',
    data: {
        labels: ['Safe', 'Phishing'],
        datasets: [{
            data: [{{ safe }}, {{ phishing }}],
            backgroundColor: [
                'green',
                'red'
            ]
    }]
    }
});
</script>

</body>

</html>
