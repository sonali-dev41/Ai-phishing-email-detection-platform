<!DOCTYPE html>
<html>
<head>
    <title>Scan History</title>
</head>
<body>

<h1>AI Phishing Email Scan History</h1>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Email</th>
    <th>Prediction</th>
    <th>Confidence</th>
    <th>Scan Time</th>
</tr>

{% for row in history %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

<td>{{ row[3] }}%</td>

<td>{{ row[4] }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
